services:
  # 1. Backend: Có Reload + Có Volumes (Code sướng)
  backend:
    build: ./backend
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload # Tự restart
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # <--- QUAN TRỌNG: Nối dây code vào trong
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # 2. Database: Giữ nguyên
  db:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - app_network

  # 3. Frontend: Giữ nguyên (Chấp nhận build lại khi sửa code)
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge